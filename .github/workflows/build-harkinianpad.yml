name: Build HarkinianPad unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harkinianpad-ipa-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      PADMINT_REPOSITORY_PRIVATE: 'false'
    steps:
      - name: Check out PadMint
        uses: actions/checkout@v4
        with:
          repository: chrissotraidis/padmint
          ref: main
          path: padmint
          persist-credentials: false

      - name: Build unsigned HarkinianPad IPA
        working-directory: padmint
        run: |
          xcodebuild -version
          df -h "$RUNNER_TEMP"
          PADMINT_HOME="$RUNNER_TEMP/padmint" \
            /usr/bin/python3 scripts/github-build.py harkinianpad --out "$RUNNER_TEMP/out"

      - name: Check out this repository for release
        uses: actions/checkout@v4
        with:
          path: release-repo
          persist-credentials: false

      - name: Collect, checksum and publish IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Files in build output:"
          find "$RUNNER_TEMP/out" -maxdepth 2 -type f -print || true
          IPA="$(find "$RUNNER_TEMP/out" -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No IPA produced" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$IPA" "$GITHUB_WORKSPACE/release/"
          cd "$GITHUB_WORKSPACE/release"
          shasum -a 256 ./*.ipa > SHA256SUMS
          cat SHA256SUMS
          cd "$GITHUB_WORKSPACE/release-repo"
          gh release create "build-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "HarkinianPad unsigned IPA (${{ github.run_number }})" \
            --notes "Unsigned, ROM-free HarkinianPad IPA built from chrissotraidis/padmint via GitHub Actions. Re-sign with AltStore/SideStore/Sideloadly before installing." \
            "$GITHUB_WORKSPACE/release/"*.ipa "$GITHUB_WORKSPACE/release/SHA256SUMS"

      - name: Upload artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: harkinianpad-unsigned-ipa
          path: |
            ${{ github.workspace }}/release/*.ipa
            ${{ github.workspace }}/release/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
